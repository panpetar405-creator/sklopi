<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predlog putovanja — SKLOPI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF9F4; --paper:#FFFEFB; --ink:#16242A; --ink-soft:#4B5D62;
    --deep:#123138; --gold:#B8863B; --gold-soft:#E7D3AC; --line:#DDD6C6;
    --gold-text:#8f6423; --on-dark-strong:#F8F4E9; --on-dark:#F4EFE3; --on-gold:#241505;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  h1,h2,.display{font-family:'Fraunces',serif;font-weight:500;letter-spacing:-0.01em;margin:0;}
  a{color:var(--gold-text);}
  .topbar-wrap{background:var(--paper);border-bottom:1px solid var(--line);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;max-width:720px;margin:0 auto;}
  .logo{font-family:'Fraunces',serif;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);}
  .logo em{color:var(--gold-text);font-style:italic;}
  .logo .mark{width:28px;height:28px;border-radius:50%;background:var(--deep);display:flex;align-items:center;justify-content:center;flex:none;}
  .logo .mark svg{width:14px;height:14px;color:var(--gold-soft);}
  .wrap{max-width:640px;margin:0 auto;padding:36px 20px 90px;}

  .state-msg{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:34px 22px;text-align:center;color:var(--ink-soft);}
  .state-msg .big{font-size:34px;margin-bottom:10px;}

  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:0.09em;color:var(--gold-text);font-weight:600;margin-bottom:8px;}
  .trip-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px 24px;margin-bottom:22px;}
  .trip-card h1{font-size:clamp(24px,5vw,32px);margin-bottom:4px;}
  .trip-meta{font-size:14.5px;color:var(--ink-soft);margin-bottom:14px;}
  .trip-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .trip-tag{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 11px;color:var(--ink-soft);}
  .trip-total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px dashed var(--line);padding-top:14px;}
  .trip-total .num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;}
  .trip-total .lab{font-size:13px;color:var(--ink-soft);}
  .disclaimer{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

  .rsvp-section h2{font-size:19px;margin-bottom:4px;color:var(--deep);}
  .rsvp-sub{font-size:14px;color:var(--ink-soft);margin-bottom:16px;}
  .rsvp-tally{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .rsvp-tally .t{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13.5px;text-align:center;}
  .rsvp-tally .t b{display:block;font-family:'Fraunces',serif;font-size:20px;color:var(--ink);}

  .rsvp-list{margin-bottom:22px;display:flex;flex-direction:column;gap:10px;}
  .rsvp-item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;}
  .rsvp-item .who{font-weight:600;display:flex;align-items:center;gap:6px;}
  .rsvp-item .cm{color:var(--ink-soft);margin-top:4px;font-size:13.5px;}
  .rsvp-empty{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin-bottom:22px;}

  .rsvp-form{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px;}
  .rsvp-form label{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:7px;font-weight:600;}
  .rsvp-form .row{margin-bottom:16px;}
  .rsvp-form input[type=text], .rsvp-form textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:5px;
    font-family:'Work Sans',sans-serif;font-size:14.5px;background:var(--bg);color:var(--ink);
  }
  .rsvp-form textarea{resize:vertical;min-height:64px;}
  .response-options{display:flex;gap:8px;flex-wrap:wrap;}
  .response-opt{flex:1;min-width:100px;text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:10px 6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:border-color .15s ease,color .15s ease,background .15s ease;}
  .response-opt input{display:none;}
  .response-opt.sel{border-color:var(--gold);color:var(--gold-text);background:rgba(184,134,59,0.08);}
  .rsvp-submit{width:100%;margin-top:6px;padding:13px;border:none;border-radius:5px;background:var(--deep);color:var(--on-dark-strong);font-family:'Work Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  .rsvp-submit:hover{opacity:0.9;}
  .rsvp-submit:disabled{opacity:0.5;cursor:default;}
  .form-msg{font-size:13px;margin-top:10px;}
  .form-msg.err{color:#B0402E;}
  .form-msg.ok{color:#3E7A4B;}

  footer{background:var(--deep);color:var(--on-dark);padding:26px 40px;margin-top:50px;font-size:12.5px;text-align:center;}
  footer a{color:var(--gold-soft);}
  .cta-back{display:block;text-align:center;margin:28px 0 6px;font-size:14px;}
</style>
</head>
<body>

<div class="topbar-wrap">
  <div class="topbar">
    <a href="index.html" class="logo">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 16l6-2 4.5-7 2 .6-2.5 6.9 5 1.5 3-2.4 1.6.5-2 3-5.5 1-1 2.6-1.8-.5.7-2.8-5 1.2-1-1.7z"/></svg></div>
      SKLOPI<em>.</em>
    </a>
  </div>
</div>

<div class="wrap" id="app">
  <div class="state-msg" id="loadingMsg"><div class="big">⏳</div>Učitavam predlog putovanja…</div>
</div>

<footer>SKLOPI — prototip proizvoda u razvoju. · <a href="privatnost.html">Privatnost</a> · <a href="uslovi-koriscenja.html">Uslovi</a> · <a href="kolacici.html">Kolačići</a></footer>

<script src="config.js"></script>
<script src="cookies.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   Javna stranica za deljeni aranžman — bez logina, bez app.js.
   Sav pristup bazi ide preko dve RPC funkcije (get_shared_trip,
   get_trip_responses, add_trip_response) definisane u
   supabase/share_trip.sql — vidi taj fajl za objašnjenje zašto
   NEMA direktnog .from('trips').select() ovde.
========================================================== */
const sb = window.supabase.createClient(window.SKLOPI_SUPABASE_URL, window.SKLOPI_SUPABASE_KEY);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtEUR(n){ return '€' + Math.round(n).toLocaleString('sr-RS'); }
function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('sr-RS', {day:'numeric', month:'short'});
}
// Ista logika kao tierLabelsForSaved() u app.js — namerno kopirana ovde
// (ne uvozimo ceo app.js jer očekuje DOM elemente sa index.html koji
// ovde ne postoje).
function tierLabelsForSaved(sel){
  if (sel.summaryTags) return sel.summaryTags;
  const flightLabels = {direct:'Direktan let', cheapest:'Najjeftiniji let', airline: sel.airlineName || 'Određena kompanija'};
  const carLabels = {none:'Bez auta', small:'Mali auto', suv:'SUV'};
  return [
    flightLabels[sel.flightPref] || 'Let',
    sel.hotelStars + '★ hotel',
    carLabels[sel.carPref] || 'Auto',
    sel.activityCount + ' aktivnosti'
  ];
}

const RESPONSE_META = {
  idem:    {emoji:'🎉', label:'Idem'},
  mozda:   {emoji:'🤔', label:'Možda'},
  ne_mogu: {emoji:'😕', label:'Ne mogu'}
};

const params = new URLSearchParams(location.search);
const token = params.get('t');
const app = document.getElementById('app');

let selectedResponse = null;

async function init(){
  if (!token){
    app.innerHTML = `<div class="state-msg"><div class="big">🔗</div>Ovaj link nije potpun — nedostaje deo sa oznakom putovanja.</div>`;
    return;
  }

  const { data: tripRows, error: tripErr } = await sb.rpc('get_shared_trip', {p_token: token});
  const trip = tripRows && tripRows[0];

  if (tripErr || !trip){
    app.innerHTML = `<div class="state-msg"><div class="big">🙈</div>Ovaj link za deljenje nije važeći, ili je aranžman u međuvremenu obrisan.<br><br><a href="index.html">Napravi svoj na Skoknici →</a></div>`;
    return;
  }

  renderTrip(trip);
  await refreshResponses();
}

function renderTrip(trip){
  const tags = tierLabelsForSaved(trip.selection || {});
  app.innerHTML = `
    <div class="eyebrow">Neko te zove na put</div>
    <div class="trip-card">
      <h1>${escapeHtml(trip.dest)}</h1>
      <div class="trip-meta">${fmtDate(trip.date_from)} – ${fmtDate(trip.date_to)} · ${trip.adults} putnik${trip.adults===1?'':'a'}</div>
      <div class="trip-tags">${tags.map(t=>`<span class="trip-tag">${escapeHtml(t)}</span>`).join('')}</div>
      <div class="trip-total">
        <span class="lab">procenjeno ukupno (za ${trip.adults} putnik${trip.adults===1?'':'a'})</span>
        <span class="num">${fmtEUR(trip.total)}</span>
      </div>
      <p class="disclaimer">⚠️ Ilustrativna procena sa Skoknice, ne stvarna ponuda partnera — pre rezervacije proverite cenu direktno na partnerskom sajtu.</p>
    </div>

    <div class="rsvp-section">
      <h2>Ko ide?</h2>
      <p class="rsvp-sub">Javi se ispod — bez pravljenja naloga.</p>
      <div class="rsvp-tally" id="rsvpTally"></div>
      <div class="rsvp-list" id="rsvpList"></div>

      <div class="rsvp-form">
        <div class="row">
          <label for="rsvpName">Tvoje ime</label>
          <input type="text" id="rsvpName" maxlength="60" placeholder="npr. Ana">
        </div>
        <div class="row">
          <label>Da li ideš?</label>
          <div class="response-options" id="responseOptions">
            <label class="response-opt" data-v="idem"><input type="radio" name="resp">🎉 Idem</label>
            <label class="response-opt" data-v="mozda"><input type="radio" name="resp">🤔 Možda</label>
            <label class="response-opt" data-v="ne_mogu"><input type="radio" name="resp">😕 Ne mogu</label>
          </div>
        </div>
        <div class="row">
          <label for="rsvpComment">Komentar (opciono)</label>
          <textarea id="rsvpComment" maxlength="300" placeholder="npr. meni odgovara samo drugi vikend u oktobru"></textarea>
        </div>
        <button type="button" class="rsvp-submit" id="rsvpSubmit">Pošalji odgovor</button>
        <p class="form-msg" id="rsvpMsg"></p>
      </div>
    </div>

    <a class="cta-back" href="index.html">🧭 Napravi i ti svoj izlet na Skoknici →</a>
  `;

  document.querySelectorAll('.response-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      document.querySelectorAll('.response-opt').forEach(o=>o.classList.remove('sel'));
      opt.classList.add('sel');
      selectedResponse = opt.dataset.v;
    });
  });

  document.getElementById('rsvpSubmit').addEventListener('click', submitResponse);
}

function renderResponses(list){
  const tallyEl = document.getElementById('rsvpTally');
  const listEl = document.getElementById('rsvpList');
  if (!tallyEl || !listEl) return;

  const counts = {idem:0, mozda:0, ne_mogu:0};
  list.forEach(r => { if (counts[r.response] !== undefined) counts[r.response]++; });
  tallyEl.innerHTML = Object.keys(RESPONSE_META).map(k =>
    `<div class="t"><b>${counts[k]}</b>${RESPONSE_META[k].emoji} ${RESPONSE_META[k].label}</div>`
  ).join('');

  if (!list.length){
    listEl.innerHTML = '<p class="rsvp-empty" id="rsvpEmptyMsg">Još niko nije odgovorio — budi prvi.</p>';
    return;
  }
  listEl.innerHTML = list.map(r => `
    <div class="rsvp-item">
      <div class="who">${RESPONSE_META[r.response] ? RESPONSE_META[r.response].emoji : ''} ${escapeHtml(r.name)}</div>
      ${r.comment ? `<div class="cm">${escapeHtml(r.comment)}</div>` : ''}
    </div>
  `).join('');
}

async function refreshResponses(){
  const { data, error } = await sb.rpc('get_trip_responses', {p_token: token});
  if (error){ console.warn('[sklopi] ucitavanje odgovora nije uspelo:', error.message); return; }
  renderResponses(data || []);
}

async function submitResponse(){
  const name = document.getElementById('rsvpName').value.trim();
  const comment = document.getElementById('rsvpComment').value.trim();
  const msgEl = document.getElementById('rsvpMsg');
  const btn = document.getElementById('rsvpSubmit');

  if (!name){ msgEl.textContent = 'Unesi svoje ime.'; msgEl.className = 'form-msg err'; return; }
  if (!selectedResponse){ msgEl.textContent = 'Izaberi jednu od tri opcije iznad.'; msgEl.className = 'form-msg err'; return; }

  btn.disabled = true;
  const { error } = await sb.rpc('add_trip_response', {
    p_token: token, p_name: name, p_response: selectedResponse, p_comment: comment || null
  });
  btn.disabled = false;

  if (error){ msgEl.textContent = 'Greška: ' + error.message; msgEl.className = 'form-msg err'; return; }

  msgEl.textContent = 'Hvala, odgovor je zabeležen!';
  msgEl.className = 'form-msg ok';
  document.getElementById('rsvpComment').value = '';
  await refreshResponses();
}

init();
</script>
</body>
</html>
