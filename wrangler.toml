name = "sklopi"
main = "worker.js"
compatibility_date = "2025-09-01"

# Servira glavni sajt (index.html, app.js, styles.css, itd.) direktno sa
# statičkih fajlova. Zahtevi koji ne pogode nijedan fajl (API rute /api/*, /go/*)
# idu u worker.js; sve ostalo nepoznato dobija 404.
[assets]
directory = "."
binding = "ASSETS"

# Svaki dan u 08:00 UTC (~10:00 po srednjoevropskom letnjem vremenu).
# Prilagodi po potrebi — https://developers.cloudflare.com/workers/
# configuration/cron-triggers/
[triggers]
crons = ["0 8 * * *"]

# Ovo su samo NEOSETLJIVE vrednosti (URL-ovi). Tajne (ključevi) NIKAD ne idu
# ovde — postavljaju se preko `wrangler secret put <ime>`:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put RESEND_API_KEY
[vars]
SUPABASE_URL = "https://qmiyaaepdvmgwesagnar.supabase.co"
ALERT_FROM_EMAIL = "SKLOPI <alerti@sklopi.rs>"
# CORS za /go/destination-images (destination-images.js). Dodaj/ukloni domene po potrebi.
ALLOWED_ORIGINS = "https://sklopi.rs,https://www.sklopi.rs,https://sklopi.panpetar405.workers.dev"
SITE_URL = "https://sklopi.panpetar405.workers.dev"

# Rate limiting (vidi rate-limit.js). Limit je PO CLOUDFLARE LOKACIJI i nije striktno
# tačan — štiti od petlji i zloupotrebe, ne služi za tačno brojanje.
# period sme da bude samo 10 ili 60; namespace_id je proizvoljan ceo broj, jedinstven na nalogu.
# Broji se samo AI poziv /api/dest-info (keš pogoci su besplatni).
[[ratelimits]]
name = "RL_DEST_IP"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "RL_DEST_GLOBAL"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 40
  period = 60

# /api/flights — svaki poziv ide na Duffel, zato je limit stroži.
[[ratelimits]]
name = "RL_FLIGHTS_IP"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "RL_FLIGHTS_GLOBAL"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 60
  period = 60

# Viator — /go/destination-activities (1 poziv po zahtevu) i /go/destination-images (do 40 poziva
# po zahtevu, zato je limit mnogo stroži).
[[ratelimits]]
name = "RL_ACT_IP"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 15
  period = 60

[[ratelimits]]
name = "RL_ACT_GLOBAL"
namespace_id = "1006"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_IMG_IP"
namespace_id = "1007"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_IMG_GLOBAL"
namespace_id = "1008"
  [ratelimits.simple]
  limit = 30
  period = 60

# Slanje potvrdnog mejla za price alerts — /go/send-confirmation (Resend + Supabase).
[[ratelimits]]
name = "RL_CONFIRM_IP"
namespace_id = "1009"
  [ratelimits.simple]
  limit = 4
  period = 60

[[ratelimits]]
name = "RL_CONFIRM_GLOBAL"
namespace_id = "1010"
  [ratelimits.simple]
  limit = 30
  period = 60

# RSVP odgovori na deljenim aranžmanima — /go/trip-response (anti-spam; vidi price-alert-worker.js).
# Opciono: `wrangler secret put TURNSTILE_SECRET` (+ SKLOPI_TURNSTILE_SITEKEY u config.js) uključuje captcha;
# `wrangler secret put RSVP_SALT` (bilo koji dug nasumičan tekst) za salt IP hash-a.
[[ratelimits]]
name = "RL_RSVP_IP"
namespace_id = "1011"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_RSVP_GLOBAL"
namespace_id = "1012"
  [ratelimits.simple]
  limit = 60
  period = 60

# Slika grada — /go/dest-image (city-image.js; Wikidata/Wikipedia, keš 30 dana). Računa se samo promašaj keša.
[[ratelimits]]
name = "RL_CITYIMG_IP"
namespace_id = "1013"
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_CITYIMG_GLOBAL"
namespace_id = "1014"
  [ratelimits.simple]
  limit = 120
  period = 60
